
name: Deploy Tanda Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tanda
        run: pnpm --dir artifacts/tanda build
        env:
          NODE_ENV: production
          BASE_PATH: /
          PORT: 5173

      - name: Add custom domain
        run: echo "tanda.com.co" > artifacts/tanda/dist/public/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/tanda/dist/public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
